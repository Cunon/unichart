<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Space Invaders</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        font-family: 'Courier New', monospace;
        color: #0f0;
    }
    h1 { margin: 10px; letter-spacing: 8px; color: #0f0; text-shadow: 0 0 10px #0f0; }
    #hud {
        width: 600px;
        display: flex;
        justify-content: space-between;
        padding: 8px 4px;
        font-size: 18px;
    }
    canvas {
        border: 2px solid #0f0;
        box-shadow: 0 0 20px rgba(0,255,0,0.4);
        background: #000;
    }
    #controls { margin-top: 10px; color: #0a0; font-size: 13px; }
</style>
</head>
<body>
<h1>SPACE INVADERS</h1>
<div id="hud">
    <span>SCORE: <span id="score">0</span></span>
    <span>LIVES: <span id="lives">3</span></span>
    <span>WAVE: <span id="wave">1</span></span>
</div>
<canvas id="game" width="600" height="600"></canvas>
<div id="controls">← → or A/D to move &nbsp;|&nbsp; SPACE to shoot &nbsp;|&nbsp; P to pause</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ---------- Pixel art for invaders (8x8 grids, '#' = pixel) ----------
const PATTERNS = {
    3: [ // top row (squid) — 30 pts
        [".###.###.",].map(s=>s),
        [
            "..#..#..",
            ".######.",
            "########",
            "#.####.#",
            "########",
            "...##...",
            "..#..#..",
            "#.#..#.#",
        ],
        [
            "..#..#..",
            ".######.",
            "########",
            "#.####.#",
            "########",
            "..####..",
            "..#..#..",
            ".##..##.",
        ],
    ].slice(1),
    2: [ // middle row (crab) — 20 pts
        [
            "#..##..#",
            "..####..",
            ".######.",
            "##.##.##",
            "########",
            "#.####.#",
            "#.#..#.#",
            "...##...",
        ],
        [
            "..##....",
            "#.####.#",
            "########",
            "########",
            "#.####.#",
            ".#.##.#.",
            "..#..#..",
            "...##...",
        ],
    ],
    1: [ // bottom row (octopus) — 10 pts
        [
            "########",
            ".######.",
            "##.##.##",
            "#.####.#",
            "########",
            "..####..",
            ".##..##.",
            "##....##",
        ],
        [
            "########",
            ".######.",
            "##.##.##",
            "#.####.#",
            "########",
            "###..###",
            "#.#..#.#",
            "........",
        ],
    ],
};
const COLORS = { 3: '#ff33cc', 2: '#2ee6ff', 1: '#b6ff3c' };

// ---------- Game state ----------
let player, bullets, enemyBullets, invaders, shields, particles;
let score, lives, wave, invaderDir, invaderSpeed;
let gameOver = false, paused = false, waveTransition = 0;
let keys = {};
let lastShot = 0;

const PLAYER_SPEED = 5;
const BULLET_SPEED = 8;
const ENEMY_BULLET_SPEED = 4;

// ---------- Setup ----------
function createInvaders() {
    invaders = [];
    const cols = 10, rows = 5;
    const spacing = 48;
    const startX = (W - (cols - 1) * spacing) / 2;
    const startY = 80;
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            invaders.push({
                x: startX + c * spacing,
                y: startY + r * 40,
                w: 32, h: 28,
                col: c,
                alive: true,
                type: r === 0 ? 3 : (r < 3 ? 2 : 1),
                frame: 0
            });
        }
    }
    invaderDir = 1;
    invaderSpeed = 0.5 + wave * 0.15;
}

function createShields() {
    // Bunkers made of small blocks, each with its own HP.
    shields = [];
    const cell = 8;
    const centers = [110, 250, 350, 490];
    for (const cx of centers) {
        const sw = 80, sh = 44;
        const ox = cx - sw / 2, oy = H - 112;
        for (let y = 0; y < sh; y += cell) {
            for (let x = 0; x < sw; x += cell) {
                const nx = x / sw, ny = y / sh;
                if (y < cell * 2 && (nx < 0.18 || nx > 0.82)) continue; // dome top corners
                if (ny > 0.55 && nx > 0.30 && nx < 0.70) continue;      // bottom entry hole
                if (nx < 0.10 || nx > 0.90) continue;                    // side taper
                shields.push({ x: ox + x, y: oy + y, w: cell, h: cell, hp: 3 });
            }
        }
    }
}

function resetGame(full = true) {
    if (full) { score = 0; lives = 3; wave = 1; }
    player = { x: W / 2 - 20, y: H - 50, w: 40, h: 22, invince: 0 };
    bullets = [];
    enemyBullets = [];
    particles = [];
    createInvaders();
    createShields();
    gameOver = false;
    updateHUD();
}

function nextWave() {
    wave++;
    bullets = [];
    enemyBullets = [];
    particles = [];
    player.x = W / 2 - 20;
    createInvaders();
    createShields();
    updateHUD();
}

// ---------- Input ----------
document.addEventListener('keydown', e => {
    if (e.code === 'Space') e.preventDefault();
    keys[e.code] = true;
    if (e.code === 'KeyP' && !gameOver) paused = !paused;
    if (gameOver && (e.code === 'Enter' || e.code === 'Space')) resetGame(true);
});
document.addEventListener('keyup', e => keys[e.code] = false);

// ---------- Helpers ----------
const overlap = (a, b) =>
    a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function spawnExplosion(x, y, color) {
    for (let i = 0; i < 14; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = 1 + Math.random() * 3;
        particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 30, color, size: 2 + Math.random() * 2 });
    }
}

// Pick the frontmost (lowest) invader of a random column.
function pickShooter() {
    const alive = invaders.filter(i => i.alive);
    if (!alive.length) return null;
    const cols = {};
    for (const i of alive) (cols[i.col] = cols[i.col] || []).push(i);
    const keysArr = Object.keys(cols);
    const column = cols[keysArr[Math.floor(Math.random() * keysArr.length)]];
    column.sort((a, b) => b.y - a.y);
    return column[0];
}

function loseLife() {
    lives--;
    updateHUD();
    spawnExplosion(player.x + player.w / 2, player.y + player.h / 2, '#0f0');
    if (lives <= 0) { gameOver = true; return; }
    player.x = W / 2 - 20;
    player.invince = 90;       // brief invulnerability
    enemyBullets = [];         // clear incoming fire
}

function updateHUD() {
    document.getElementById('score').textContent = score;
    document.getElementById('lives').textContent = Math.max(0, lives);
    document.getElementById('wave').textContent = wave;
}

// ---------- Update ----------
function update() {
    if (paused || gameOver) return;

    if (waveTransition > 0) {
        if (--waveTransition === 0) nextWave();
        updateParticles();
        return;
    }

    // Player movement
    if (keys['ArrowLeft'] || keys['KeyA']) player.x -= PLAYER_SPEED;
    if (keys['ArrowRight'] || keys['KeyD']) player.x += PLAYER_SPEED;
    player.x = Math.max(5, Math.min(W - player.w - 5, player.x));
    if (player.invince > 0) player.invince--;

    // Player shooting
    const now = Date.now();
    if (keys['Space'] && now - lastShot > 400) {
        bullets.push({ x: player.x + player.w / 2, y: player.y, w: 3, h: 12 });
        lastShot = now;
    }
    for (const b of bullets) b.y -= BULLET_SPEED;
    bullets = bullets.filter(b => b.y > -20);

    // Invader movement (horizontal, then step down on wall hit)
    const alive = invaders.filter(i => i.alive);
    if (alive.length) {
        const minX = Math.min(...alive.map(i => i.x));
        const maxX = Math.max(...alive.map(i => i.x + i.w));
        if ((invaderDir > 0 && maxX + invaderSpeed >= W - 10) ||
            (invaderDir < 0 && minX - invaderSpeed <= 10)) {
            invaderDir *= -1;
            for (const i of invaders) i.y += 15;
        }
        for (const i of invaders) if (i.alive) i.x += invaderSpeed * invaderDir;
        invaderSpeed += 0.0004;
        // Animation flip
        if (Math.floor(now / 500) % 2 === 0)
            for (const i of invaders) if (i.alive) i.frame = 1 - i.frame;
    }

    // Enemy shooting: fires from a specific invader (frontmost of a random column)
    if (Math.random() < 0.015 + wave * 0.004) {
        const shooter = pickShooter();
        if (shooter) {
            enemyBullets.push({
                x: shooter.x + shooter.w / 2,
                y: shooter.y + shooter.h,   // originates from the enemy
                w: 4, h: 10
            });
        }
    }
    for (const b of enemyBullets) b.y += ENEMY_BULLET_SPEED;
    enemyBullets = enemyBullets.filter(b => b.y < H + 20);

    // ---- Player bullets vs invaders ----
    for (const b of bullets) {
        const bb = { x: b.x, y: b.y, w: b.w, h: b.h };
        for (const i of invaders) {
            if (!i.alive) continue;
            if (overlap(bb, i)) {
                i.alive = false;
                b.dead = true;
                score += i.type * 10;
                spawnExplosion(i.x + i.w / 2, i.y + i.h / 2, COLORS[i.type]);
                updateHUD();
                break;
            }
        }
    }
    bullets = bullets.filter(b => !b.dead);

    // ---- Player bullets vs shields (shields block & take damage) ----
    for (const b of bullets) {
        for (const c of shields) {
            if (c.hp > 0 && overlap(b, c)) { c.hp--; b.dead = true; break; }
        }
    }
    bullets = bullets.filter(b => !b.dead);

    // ---- Enemy bullets vs shields (shields block & take damage) ----
    for (const b of enemyBullets) {
        for (const c of shields) {
            if (c.hp > 0 && overlap(b, c)) { c.hp--; b.dead = true; break; }
        }
    }
    // ---- Enemy bullets vs player ----
    if (player.invince === 0) {
        for (const b of enemyBullets) {
            if (!b.dead && overlap(b, player)) { b.dead = true; loseLife(); }
        }
    }
    enemyBullets = enemyBullets.filter(b => !b.dead);

    // ---- Invaders reach the player line ----
    for (const i of invaders) {
        if (i.alive && i.y + i.h >= player.y) { gameOver = true; break; }
    }

    // Wave cleared?
    if (!invaders.some(i => i.alive)) waveTransition = 90;

    updateParticles();
}

function updateParticles() {
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life--; }
    particles = particles.filter(p => p.life > 0);
}

// ---------- Render ----------
function drawPlayer() {
    const { x, y, w, h } = player;
    const blink = player.invince > 0 && Math.floor(Date.now() / 80) % 2 === 0;
    ctx.globalAlpha = blink ? 0.35 : 1;
    ctx.fillStyle = '#0f0';
    ctx.fillRect(x, y + h - 9, w, 9);              // base
    ctx.beginPath();                                 // hull
    ctx.moveTo(x + w / 2, y);
    ctx.lineTo(x + w, y + h - 9);
    ctx.lineTo(x, y + h - 9);
    ctx.closePath();
    ctx.fill();
    ctx.fillRect(x + w / 2 - 2, y - 6, 4, 10);        // cannon
    ctx.globalAlpha = 1;
}

function drawInvader(i) {
    const px = i.w / 8, py = i.h / 8;
    const rows = PATTERNS[i.type][i.frame];
    ctx.fillStyle = COLORS[i.type];
    for (let r = 0; r < 8; r++) {
        for (let c = 0; c < 8; c++) {
            if (rows[r][c] === '#') ctx.fillRect(i.x + c * px, i.y + r * py, px, py);
        }
    }
}

function render() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // Invaders
    for (const i of invaders) if (i.alive) drawInvader(i);

    // Shields (color dims as HP drops)
    for (const c of shields) {
        if (c.hp <= 0) continue;
        const shade = 60 + c.hp * 50;
        ctx.fillStyle = `rgb(20, ${shade}, 60)`;
        ctx.fillRect(c.x, c.y, c.w, c.h);
    }

    // Bullets
    ctx.fillStyle = '#fff';
    for (const b of bullets) ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = '#ff5a5a';
    for (const b of enemyBullets) ctx.fillRect(b.x, b.y, b.w, b.h);

    // Player
    if (lives > 0) drawPlayer();

    // Particles
    for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / 30);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    // Overlays
    ctx.textAlign = 'center';
    if (waveTransition > 0) {
        ctx.fillStyle = '#0f0';
        ctx.font = 'bold 40px Courier New';
        ctx.fillText('WAVE ' + wave + ' CLEARED', W / 2, H / 2 - 10);
        ctx.font = '18px Courier New';
        ctx.fillText('get ready...', W / 2, H / 2 + 24);
    }
    if (gameOver) {
        ctx.fillStyle = '#ff3355';
        ctx.font = 'bold 48px Courier New';
        ctx.fillText('GAME OVER', W / 2, H / 2 - 10);
        ctx.fillStyle = '#0f0';
        ctx.font = '18px Courier New';
        ctx.fillText('final score: ' + score, W / 2, H / 2 + 24);
        ctx.fillText('press SPACE to restart', W / 2, H / 2 + 50);
    }
    if (paused) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 36px Courier New';
        ctx.fillText('PAUSED', W / 2, H / 2);
    }
    ctx.textAlign = 'left';
}

// ---------- Loop ----------
function loop() {
    update();
    render();
    requestAnimationFrame(loop);
}

resetGame(true);
loop();
</script>
</body>
</html>
